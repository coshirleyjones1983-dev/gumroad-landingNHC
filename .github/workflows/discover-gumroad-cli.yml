name: Discover Gumroad CLI pages commands (read-only)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Print CLI version
        run: gumroad --version

      - name: Print auth login help
        run: timeout 20 gumroad auth login --help < /dev/null
        continue-on-error: true

      - name: Print auth status help
        run: timeout 20 gumroad auth status --help < /dev/null
        continue-on-error: true
